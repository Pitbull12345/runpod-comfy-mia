name: Build RunPod ComfyUI images
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: cu128
            cuda_image: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
            torch_index: cu128
          - tag: cu130
            cuda_image: nvidia/cuda:13.0.1-cudnn-runtime-ubuntu24.04
            torch_index: cu130

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/runpod-comfy-mia:${{ matrix.tag }}
          build-args: |
            CUDA_IMAGE=${{ matrix.cuda_image }}
            TORCH_INDEX=${{ matrix.torch_index }}
            TORCH_VERSION=2.11.0
            TORCHVISION_VERSION=0.26.0
            TORCHAUDIO_VERSION=2.11.0
            COMFY_REF=master
          cache-from: type=gha
          cache-to: type=gha,mode=max
