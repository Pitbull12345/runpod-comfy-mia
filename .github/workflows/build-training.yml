name: Build AI Toolkit training image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.train
      - start-train.sh
      - .github/workflows/build-training.yml

permissions:
  contents: read
  packages: write

jobs:
  build-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push train-cu130
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.train
          push: true
          tags: ghcr.io/pitbull12345/runpod-comfy-mia:train-cu130
          build-args: |
            AI_TOOLKIT_REF=main
          cache-from: type=gha
          cache-to: type=gha,mode=max
